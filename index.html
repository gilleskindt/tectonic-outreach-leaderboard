<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tectonic · Outreach leaderboard</title><style>
@import url('https://fonts.googleapis.com/css2?family=Anybody:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#050a2b;--surface:#101748;--line:#ffffff24;--accent:#80e7e0;--muted:#aeb9dd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 90% 0%,#182ab080,transparent 55%),var(--bg);color:white;font:14px 'Anybody',sans-serif}main{width:min(1160px,100%);height:100dvh;margin:auto;padding:24px 32px 16px;display:flex;flex-direction:column;gap:18px;min-height:0}header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border:1px solid var(--line);border-radius:45px;background:#111a585e;flex-shrink:0}.brand img{display:block;width:155px;height:35px;object-fit:contain}a{color:white;text-decoration:none}.sheet{padding:10px 20px;border:2px solid #6b8af4;border-radius:45px;font-weight:600;box-shadow:0 0 15px #3b61f02b}.sheet:hover{background:#273d97}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-shrink:0}h1{margin:0;font-size:clamp(25px,3.8vw,42px);font-weight:600;letter-spacing:-1.5px;line-height:1.1}.intro p{margin:9px 0 0;color:var(--muted);font-size:13px}.live{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);white-space:nowrap}.live:before{content:'';display:inline-block;background:var(--accent);width:6px;height:6px;border-radius:50%;margin-right:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex-shrink:0}.stat{padding:15px 20px;border:1px solid var(--line);background:linear-gradient(120deg,#142065,#0c123c);border-radius:15px;display:flex;align-items:baseline;gap:12px}.stat strong{font-size:31px;font-weight:600;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}.panel{display:flex;flex-direction:column;min-height:0;flex:1;border:1px solid var(--line);border-radius:18px;background:#0b123bd6;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;flex-shrink:0}h2{font-size:16px;font-weight:500;margin:0}.toolbar small{color:var(--muted)}input{min-width:0;width:260px;max-width:55%;background:#050a2b;border:1px solid #ffffff30;border-radius:30px;padding:10px 15px;color:white;font:inherit;font-size:12px;outline:none}input:focus{border-color:var(--accent)}.table-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-color:#4c63ba #0b123b;scrollbar-width:thin}table{width:100%;border-spacing:0;table-layout:fixed}th{position:sticky;top:0;z-index:1;background:#101846;padding:12px 20px;color:var(--muted);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:500}th:first-child{width:70px}th:last-child{width:150px}td{padding:14px 20px;border-top:1px solid #ffffff12}th:last-child,td:last-child{text-align:right}td:first-child{color:var(--muted);font-size:13px}.name{font-weight:500;display:block;font-size:14px}.email{display:block;color:var(--muted);font-size:11px;margin-top:4px;overflow-wrap:anywhere}.score{font-size:23px;font-weight:600}.bar{height:3px;background:linear-gradient(90deg,#567bf5,var(--accent));border-radius:4px;margin-top:6px;width:var(--w);margin-left:auto}.top{background:#2c49bb26}.top .score{color:var(--accent)}.zero .score{color:#8491bd}footer{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:10px;color:var(--muted);flex-shrink:0;line-height:1.4}#error{margin:0;color:#ffbdba}#error:empty{display:none}#empty{display:none;margin:20px;color:var(--muted);text-align:center}@media(max-width:600px){main{padding:12px;gap:12px}header{padding:8px 12px}.brand img{width:112px;height:28px}.sheet{font-size:10px;padding:8px 12px}.intro{align-items:start}.intro p{font-size:11px}.live{font-size:9px;margin-top:7px}.stat{padding:11px 12px;display:block}.stat strong{display:block;font-size:26px}.stat span{font-size:9px}.stats{gap:8px}.toolbar{padding:12px;gap:8px}h2{font-size:13px}input{width:180px;font-size:10px}th,td{padding:12px}th:first-child{width:44px}th:last-child{width:65px}.name{font-size:12px}.email{font-size:10px}.score{font-size:21px}footer{display:block;font-size:9px}footer span{display:block;margin-top:3px}}@media(max-height:560px){main{padding-top:10px;gap:8px}header{padding:6px 14px}.brand img{height:24px}h1{font-size:24px}.intro p{display:none}.stat{padding:7px 15px}.stat strong{font-size:24px}.toolbar{padding:9px 14px}footer{font-size:9px}}
</style></head><body><main><header><a class="brand" href="https://www.tectonicconf.eu" target="_blank" rel="noopener"><img src="https://www.tectonicconf.eu/assets/tectonic-logo.svg" alt="Tectonic"></a><a class="sheet" id="sheet" href="https://docs.google.com/spreadsheets/d/16BelYduZSjXx8Ng0HS3Pmr11pYQ_c2LpXJ1CWCJJ3QI/edit?gid=1578630869" target="_blank" rel="noopener">Open outreach sheet ↗</a></header><section class="intro"><div><h1>Outreach leaderboard</h1><p>Confirmed sends by Tect email.</p></div><span class="live" id="connection">Connecting to sheet</span></section><section class="stats"><div class="stat"><strong id="total">—</strong><span>confirmed sends</span></div><div class="stat"><strong id="active">—</strong><span>active senders</span></div><div class="stat"><strong id="team">—</strong><span>team members</span></div></section><section class="panel"><div class="toolbar"><h2>Team rankings</h2><input id="search" type="search" aria-label="Search members" placeholder="Search name or email"></div><div class="table-scroll" tabindex="0" role="region" aria-label="Team rankings"><table><thead><tr><th>Rank</th><th>Team member</th><th>Sent</th></tr></thead><tbody id="rows"></tbody></table><p id="empty">No matching members</p></div></section><p id="error" role="status"></p><footer><div id="updated">Loading sheet…</div><span>Direct sheet connection · refreshes every 30s · confirmed sends only</span></footer></main><script>

let members=[],roster=[],pending=null;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let prev=-1,rank=0;const max=Math.max(1,...members.map(m=>m.sent));const q=document.querySelector('#search').value.toLowerCase();const filtered=members.map((m,i)=>{if(m.sent!==prev){rank=i+1;prev=m.sent}return {...m,rank}}).filter(m=>(m.name+' '+m.email).toLowerCase().includes(q));document.querySelector('#rows').innerHTML=filtered.map(m=>`<tr class="${m.sent>0&&m.sent===max?'top':m.sent===0?'zero':''}"><td>${m.rank.toString().padStart(2,'0')}</td><td><span class="name">${safe(m.name)}</span><span class="email">${safe(m.email)}</span></td><td><span class="score">${m.sent}</span><div class="bar" style="--w:${m.sent/max*100}%"></div></td></tr>`).join('');document.querySelector('#empty').style.display=filtered.length?'none':'block'}
function fail(){document.querySelector('#connection').textContent='Connection unavailable';document.querySelector('#error').textContent='Sheet refresh failed. Retrying automatically; any displayed counts are from the last successful read.'}
window.sheetResponse=function(response){if(!pending)return;clearTimeout(pending.timeout);pending.script.remove();pending=null;if(response.status!=='ok'||!response.table){fail();return}const map=new Map(roster.map(m=>[m.email.trim().toLowerCase(),{name:m.name,email:m.email.trim().toLowerCase(),sent:0}]));for(const row of response.table.rows){const email=String(row.c[0]?.v||'').trim().toLowerCase();const sent=Number(row.c[1]?.v||0);if(!email||!Number.isFinite(sent))continue;if(!map.has(email))map.set(email,{name:email.split('@')[0],email,sent:0});map.get(email).sent+=sent}members=[...map.values()].sort((a,b)=>b.sent-a.sent||a.name.localeCompare(b.name));document.querySelector('#total').textContent=members.reduce((a,m)=>a+m.sent,0);document.querySelector('#active').textContent=members.filter(m=>m.sent>0).length;document.querySelector('#team').textContent=members.length;document.querySelector('#updated').textContent='Sheet read '+new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/Brussels'})+' · Brussels';document.querySelector('#connection').textContent='Live from Google Sheets';document.querySelector('#error').textContent='';render()};
function refresh(){if(pending)return;const script=document.createElement('script');const query="select F,count(F) where lower(K) starts with 'verified sent' or lower(K) = 'sent; verified in linkedin conversation' group by F label F 'email',count(F) 'sent'";script.src='https://docs.google.com/spreadsheets/d/16BelYduZSjXx8Ng0HS3Pmr11pYQ_c2LpXJ1CWCJJ3QI/gviz/tq?gid=1578630869&headers=1&tqx='+encodeURIComponent('out:json;responseHandler:sheetResponse')+'&tq='+encodeURIComponent(query)+'&_='+Date.now();const timeout=setTimeout(()=>{script.remove();pending=null;fail()},15000);pending={script,timeout};script.onerror=()=>{clearTimeout(timeout);script.remove();pending=null;fail()};document.head.appendChild(script)}
async function start(){try{const r=await fetch('data.json',{cache:'no-store'});if(!r.ok)throw Error('Roster unavailable');const d=await r.json();roster=d.members.map(m=>({name:m.name,email:m.email}));refresh();setInterval(refresh,30000)}catch(e){document.querySelector('#error').textContent='Could not load the team roster. Please reload.'}}
 document.querySelector('#search').addEventListener('input',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});start();
</script></body></html>
